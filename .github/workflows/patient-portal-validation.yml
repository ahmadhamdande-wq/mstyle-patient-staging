name: Patient portal validation
on:
  pull_request:
    paths:
      - 'app/api/portal/**'
      - 'app/settings/patient-portal/**'
      - 'app/workspace.tsx'
      - 'lib/resend-email.ts'
      - '.github/workflows/patient-portal-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:independent
